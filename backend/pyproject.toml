[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "meeting-summarizer-backend"
version = "0.1.0"
description = "Meeting Recording Summarizer Backend API and Celery Worker"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Meeting Summarizer Team" }
]
dependencies = [
    "fastapi>=0.110.0",
    "groq>=1.7.0",
    "uvicorn[standard]>=0.28.0",
    "pydantic>=2.6.4",
    "pydantic-settings>=2.2.1",
    "celery>=5.3.6",
    "redis>=5.0.3",
    "sqlalchemy[asyncio]>=2.0.28",
    "greenlet>=3.0.3",
    "alembic>=1.13.1",
    "psycopg[binary]>=3.1.18",
    "boto3>=1.34.69",
    "httpx>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.1.1",
    "pytest-asyncio>=0.23.6",
    "pytest-mock>=3.14.0",
    "ruff>=0.3.4",
    "mypy>=1.9.0",
    "boto3-stubs[s3]>=1.34.69",
    "types-redis>=4.6.0.20240311",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "C4",  # flake8-comprehensions
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008", # do not perform function calls in argument defaults (FastAPI Depends idiom)
    "UP046", # Generic class uses Generic subclass instead of PEP 695 type parameters (Pydantic v2 compatibility)
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_any_generics = true
ignore_missing_imports = true
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
check_untyped_defs = true

[[tool.mypy.overrides]]
module = "app.workers.tasks"
disallow_untyped_decorators = false

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

